#US Senator Deb Fischer
bioguide: F000463
contact_form:
  driver: chrome
  steps:
    - visit: "https://www.fischer.senate.gov/connect/email-deb/"
    - find: 
        - selector: input#input_7_13
    - fill_in:
        - name: Your Prefix
          selector: input#input_7_13
          value: $NAME_PREFIX
          required: false
        - name: First Name
          selector: input#input_7_3
          value: $NAME_FIRST
          required: true
        - name: Last Name
          selector: input#input_7_4
          value: $NAME_LAST
          required: true
        - name: street
          selector: input#input_7_5_1
          value: $ADDRESS_STREET
          required: true
        - name: street2
          selector: input#input_7_5_2
          value: $ADDRESS_STREET_2
          required: false
        - name: city
          selector: input#input_7_5_3
          value: $ADDRESS_CITY
          required: true
        - name: zip5
          selector: input#input_7_5_5
          value: $ADDRESS_ZIP5
          required: true
        - name: phone
          selector: input#input_7_7
          value: $PHONE
          required: true
        - name: email
          selector: input#input_7_8
          value: $EMAIL
          required: true
        - name: subject
          selector: "#input_7_10"
          value: $SUBJECT 
          required: true
        - name: message
          selector: textarea#input_7_11
          value: $MESSAGE
          required: true
    - select:
        - name: state
          selector: select#input_7_5_4
          value: $ADDRESS_STATE_FULL
          required: true
          options: 
            Nebraska: Nebraska 
        - name: topic
          selector: select#input_7_9
          value: $TOPIC
          required: true
          options:
            Agriculture: Agriculture
            Banking: Banking
            Budget: Budget
            Defense: "Defense,Terrorism"
            Economy: Economy
            Education: Education
            Energy: Energy
            Environment: Environment
            Government: Federal Government
            Foreign Affairs: Foreign Affairs
            Health: Health
            Housing: Housing
            Immigration: Immigration
            Intelligence: Intelligence/National Security
            Judiciary: Judiciary
            Labor: "Labor,Unemployment Issues"
            Healthcare: Medicaid/Medicare
            Science and Technology: Science and Technology
            Senior Issues: Senior Issues
            Second Amendment Rights: Second Amendment Rights
            Small Business: Small Business
            Social Security: Social Security
            Taxes: Taxes
            Communications: Telecommunications
            Trade: Trade
            Transportation: Transportation
            Veterans: Veterans' Affairs
            Welfare: Welfare
            Other: Other
    - javascript:
        - commands:
            - "document.querySelector('#choice_7_12_1')?.click()"
            - "document.querySelector('#gform_submit_button_7').click()"
    - wait:
      - value: 2
  success:
    headers:
      status: 200
    body:
      contains: "Thank you"
