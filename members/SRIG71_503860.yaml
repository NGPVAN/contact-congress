# Rhode Island Governor Dan McKee
bioguide: SRIG71_503860
contact_form:
  driver: chrome
  steps:
    - visit: "https://governor.ri.gov/contact"
    - iframe:
        - selector: "iframe[src*='EForm.aspx']"
          back: false
    - fill_in:
        - name: First Name
          selector: "#qi_1_first_name"
          value: $NAME_FIRST
          required: true
        - name: Last Name
          selector: "#qi_1_last_name"
          value: $NAME_LAST
          required: true
        - name: Email
          selector: "#qi_1_email"
          value: $EMAIL
          required: true
        - name: Phone
          selector: "#qi_1_hphone"
          value: $PHONE
          required: true
        - name: Address
          selector: "#qi_1_addr_1"
          value: $ADDRESS_STREET
          required: true
        - name: City
          selector: "#qi_1_city"
          value: $ADDRESS_CITY
          required: true
        - name: Zip
          selector: "#qi_1_zip"
          value: $ADDRESS_ZIP5
          required: true
        - name: Message
          selector: "#qi_2"
          value: $MESSAGE
          options:
            max_length: 2000
          required: true
    - select: 
        - name: prefix
          selector: "#qi_1_prefix"
          value: $NAME_PREFIX
          required: true
          options: 
              0_Miss: Miss
              1_Mr.: Mr. 
              2_Mr. and Mrs.: Mr. and Mrs. 
              3_Mrs.: Mrs. 
              4_Ms.: Ms. 
              5_Mx.: Mx.
        - name: state
          selector: "#qi_1_state"
          value: $ADDRESS_STATE_FULL
          required: true
          options:
              48_RI: Rhode Island
        - name: Topic
          selector: "#qi_3"
          value: $TOPIC
          required: true
          options:
              16_COMMENTS: COMMENTS -- General Comments or Concerns
    - wait: 
        - value: 3
    - javascript: 
        - selector: ["#btn_submit"] 
          commands: ["document.querySelector('#btn_submit').scrollIntoView({block:'center'});"]
          required: true
    - click_on:
        - value: Submit
          selector: "#btn_submit"
  success:
    body:
      contains: "Thank for"
